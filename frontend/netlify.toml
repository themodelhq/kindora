# KINDORA frontend - Netlify configuration
# The frontend deploys from this directory (rootDir in Netlify UI) with this file.
#
# v1.0.1 hardening:
#  - CSP connect-src now also allows https://*.onrender.com so a pre-DNS
#    deployment (frontend on *.netlify.app, API on *.onrender.com) works
#    without a code change; tighten to the exact API origin after DNS setup.
#  - HSTS added (1 year, includeSubDomains).
#  - The API responses are never cached here; the service worker is
#    NetworkOnly for /api/ (see vite.config.ts) so security-critical API
#    updates always reach users (stale SW cannot pin old behaviour).

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing: every route serves the app shell (deep links from WhatsApp,
# Facebook, Google, browser refresh all resolve correctly).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      font-src 'self' data:;
      connect-src 'self' https://api.kindora.com https://*.onrender.com https://*.paystack.co https://api.flutterwave.com https://api.stripe.com https://api-m.paypal.com https://api-m.sandbox.paypal.com https://*.sentry.io;
      frame-src https://*.paystack.co https://api.flutterwave.com https://js.stripe.com https://www.paypal.com https://api-m.sandbox.paypal.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """
    # HSTS: force TLS for 1 year incl. subdomains, report-only violations to nothing
    # (the API domain enforces its own HSTS at the edge via Render).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Service worker and manifest must always be fresh
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Immutable fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
